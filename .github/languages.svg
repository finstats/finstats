<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-labelledby="title">
<title id="title">Translation status of FinStats</title>
<style>
.card { fill: #ffffff; stroke: #d0d7de; }
.title { fill: #1f2328; font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.sub, .tag { fill: #59636e; font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.name { fill: #1f2328; font: 500 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.share { fill: #1f2328; font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.track { fill: #ece6fd; }
.bar { fill: #8a5cf5; }
@media (prefers-color-scheme: dark) {
.card { fill: #0d1117; stroke: #3d444d; }
.title, .name, .share { fill: #f0f6fc; }
.sub, .tag { fill: #9198a1; }
.track { fill: #2b2440; }
}
</style>
<rect class="card" x="0.5" y="0.5" width="559" height="219" rx="10"/>
<text class="title" x="24" y="34">Translation status</text>
<text class="sub" x="24" y="54">3,662 texts in the interface and 70 Patch notes releases, counted from the catalogues</text>
<text class="name" x="24" y="91">English (UK)</text>
<text class="tag" x="140" y="91">en-GB</text>
<rect class="track" x="206" y="81" width="270" height="10" rx="5"/>
<rect class="bar" x="206" y="81" width="270" height="10" rx="5"/>
<text class="share" x="536" y="91" text-anchor="end">100%</text>
<text class="name" x="24" y="125">English (US)</text>
<text class="tag" x="140" y="125">en-US</text>
<rect class="track" x="206" y="115" width="270" height="10" rx="5"/>
<rect class="bar" x="206" y="115" width="270" height="10" rx="5"/>
<text class="share" x="536" y="125" text-anchor="end">100%</text>
<text class="name" x="24" y="159">Norsk Bokmål</text>
<text class="tag" x="140" y="159">nb-NO</text>
<rect class="track" x="206" y="149" width="270" height="10" rx="5"/>
<rect class="bar" x="206" y="149" width="270" height="10" rx="5"/>
<text class="share" x="536" y="159" text-anchor="end">100%</text>
<text class="name" x="24" y="193">Norsk Nynorsk</text>
<text class="tag" x="140" y="193">nn-NO</text>
<rect class="track" x="206" y="183" width="270" height="10" rx="5"/>
<rect class="bar" x="206" y="183" width="270" height="10" rx="5"/>
<text class="share" x="536" y="193" text-anchor="end">100%</text>
</svg>
