<svg xmlns="http://www.w3.org/2000/svg" width="600" height="862" viewBox="0 0 600 862" role="img" aria-labelledby="title">
<title id="title">Translation status of FinStats</title>
<style>
.card { fill: #ffffff; stroke: #d0d7de; }
.title { fill: #1f2328; font: 600 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.group { fill: #1f2328; font: 600 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.sub, .tag { fill: #59636e; font: 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.name { fill: #1f2328; font: 500 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.share { fill: #1f2328; font: 600 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
.track { fill: #ece6fd; }
.bar { fill: #8a5cf5; }
.bar.unchecked { fill: #b39af8; }
@media (prefers-color-scheme: dark) {
.card { fill: #0d1117; stroke: #3d444d; }
.title, .group, .name, .share { fill: #f0f6fc; }
.sub, .tag { fill: #9198a1; }
.track { fill: #2b2440; }
.bar.unchecked { fill: #6f52c9; }
}
</style>
